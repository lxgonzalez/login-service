name: Pipeline for Login Microservice

on:
  push:
    branches:
      - test
  pull_request:
    branches: 
      - test
jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{secrets.DOCKER_IMAGE_LOGIN}}:latest .

      - name: Push Docker image to Dockerhub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{secrets.DOCKER_IMAGE_LOGIN}}:latest

  deploy-to-ec2-instance:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_TEST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "Pull, stop, and redeploy the Docker container"
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{secrets.DOCKER_IMAGE_LOGIN}}:latest
            docker stop ${{secrets.DOCKER_IMAGE_LOGIN}}|| true
            docker rm ${{secrets.DOCKER_IMAGE_LOGIN}} || true
            docker run --restart always -e GOOGLE_CLIENT_ID=${{secrets.GOOGLE_CLIENT_ID}} \
                       -e GOOGLE_CLIENT_SECRET=${{secrets.GOOGLE_CLIENT_SECRET}} \
                       -e BROKER_URL=${{secrets.BROKER_URL}} \
                       -e FRONTEND_URL=${{secrets.FRONTEND_URL}} \
                       -e SESSION_SECRET=${{secrets.SESSION_SECRET}} \
                       -e API_GATEWAY=${{secrets.API_GATEWAY}} \
                       -d --name ${{secrets.DOCKER_IMAGE_LOGIN}} \
                       -p 1028:1028 ${{secrets.DOCKER_USERNAME}}/${{secrets.DOCKER_IMAGE_LOGIN}}:latest